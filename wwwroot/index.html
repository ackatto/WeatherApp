<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Погода - сейчас, завтра, 5 дней</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Прогноз погоды</h2>
    <div>
        <input type="text" id="cityInput" placeholder="Введите город" value="Москва">
        <button id="showBtn">Показать</button>
    </div>
    <div class="mode-buttons">
        <button class="mode-btn" data-mode="now">Сейчас</button>
        <button class="mode-btn" data-mode="tomorrow">Завтра</button>
        <button class="mode-btn" data-mode="5days">5 дней</button>
    </div>
    <div id="result"></div>
    <script src="app.js"></script>
</body>
</html>
